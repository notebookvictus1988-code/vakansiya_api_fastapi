name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: job_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: job_portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_user -d job_portal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://job_user:test_password@localhost:5432/job_portal
      JWT_SECRET_KEY: test-only-secret-key-please-change-1234567890
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt ruff
      - run: ruff check app tests scripts alembic
      - run: python -m compileall -q app scripts
      - run: alembic upgrade head
      - run: python -m pytest -q
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Upload application files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app,alembic,alembic.ini,requirements.txt,scripts,deploy"
          target: "/opt/vakansiya-api"
          overwrite: true
          strip_components: 0
      - name: Install dependencies, migrate and restart service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            cd /opt/vakansiya-api
            test -f .env || { echo 'Missing /opt/vakansiya-api/.env'; exit 1; }
            python3 -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/pip install -r requirements.txt
            .venv/bin/alembic upgrade head
            sudo systemctl restart job-api
            sudo systemctl is-active --quiet job-api
            for attempt in $(seq 1 15); do
              if curl --fail --silent http://127.0.0.1:8000/health; then exit 0; fi
              sleep 2
            done
            echo 'Health check failed after deployment'
            sudo journalctl -u job-api -n 80 --no-pager
            exit 1
